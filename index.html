<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="author" content="Kritika">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Rock, Paper, Scissors!">
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css">
        <title>Rock, Paper, Scissors!</title>
    </head>
    <body>
        <h1>Rock, Paper, Scissors<hr></h1>
        <p>Ready? Select an option below to play! We will play five rounds!</p>
        <section class="gameSection">
            <button class="">👊 Rock</button>
            <button class="">🖐️ Paper</button>
            <button class="">✌️ Scissors</button>
        </section>
        <hr>
        <div><em>
            Trivia: Did you know that the popular band, 
            <a href="https://www.youtube.com/watch?v=RbctNBlXBJc" target="_blank">BTS</a> is the official brand ambassador of the
             game, "Rock, Paper, Scissors"?</em>
        </div>
        <div class ="currentRound">
            <div id="rounds">
                <span>Round: </span>
            </div>
            <div id="computerPick">
                <span>Computer Picked: </span>
            </div>
        </div>
        <section class="scoreSection">
            <h3><u>Current Scores</u></h3>
            <div>
                <div id="computerScore">
                    <span>Computer: </span>
                </div>
                <div id="humanScore">
                    <span>You: </span>
                </div>
            </div>
        </section>
        <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
        <script src="script.js"></script>
    </body>
</html>
